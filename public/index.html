<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI Holdem Coach</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>.tab-active { color: #818cf8; border-bottom: 2px solid #818cf8; }.tab-inactive { color: #64748b; border-bottom: 2px solid transparent; }.tier-premium { background: #dc2626; }.tier-strong { background: #ea580c; }.tier-playable { background: #ca8a04; }.tier-speculative { background: #2563eb; }.tier-trash { background: #64748b; }.mode-active { background: #4f46e5; color: white; }.mode-inactive { background: #1e293b; color: #94a3b8; }
</style>
</head>
<body class="h-full flex flex-col max-w-xl mx-auto shadow-2xl bg-slate-900 text-slate-100 font-sans">
<header class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/80 backdrop-blur sticky top-0 z-10">
<div class="flex items-center space-x-3">
<div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
<h1 class="font-semibold text-base sm:text-lg">AI Holdem Coach</h1>
</div>
<button id="logout-btn" class="text-xs text-slate-400 hover:text-slate-200 hidden">Sign out</button>
</header>

<div id="auth-screen" class="flex-1 flex items-center justify-center p-6">
<div class="w-full max-w-sm space-y-6">
<div class="text-center space-y-2">
<h2 class="text-2xl font-bold text-slate-100">Welcome</h2>
<p class="text-sm text-slate-400">Sign in to start getting real reads.</p>
</div>
<div class="space-y-3">
<input id="email" type="email" placeholder="Email" class="w-full bg-slate-800 text-slate-100 text-sm rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700" />
<input id="password" type="password" placeholder="Password" class="w-full bg-slate-800 text-slate-100 text-sm rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700" />
</div>
<div class="space-y-2">
<button id="signin-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-3 rounded-lg transition">Sign In</button>
<button id="signup-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-white text-sm font-semibold py-3 rounded-lg transition">Create Account</button>
</div>
<p id="auth-error" class="text-xs text-red-400 text-center hidden"></p>
</div>
</div>

<div id="app-screen" class="hidden flex-1 flex flex-col">
<div class="flex border-b border-slate-800">
<button id="tab-coach" class="flex-1 py-3 text-sm font-semibold tab-active transition">Coach</button>
<button id="tab-history" class="flex-1 py-3 text-sm font-semibold tab-inactive transition">History</button>
</div>

<div id="coach-view" class="flex-1 flex flex-col">
<div id="mode-toggle" class="flex gap-2 p-3 border-b border-slate-800">
<button id="mode-coach-btn" class="flex-1 text-xs font-semibold py-2 rounded-lg mode-active transition">Coach</button>
<button id="mode-track-btn" class="flex-1 text-xs font-semibold py-2 rounded-lg mode-inactive transition">Track</button>
</div>
<div id="mode-label" class="px-4 pt-2 pb-1"><p class="text-xs text-slate-500">Get real strategy on your hands.</p></div>
<main id="chatbox" class="flex-1 overflow-y-auto p-4 space-y-4">
<div class="flex items-start">
<div class="bg-slate-800 text-slate-200 px-4 py-2.5 rounded-2xl rounded-tl-sm text-sm max-w-[85%] shadow-sm">
Send me any poker hand - your hole cards, the board, your position - and I'll give you a real read.
</div>
</div>
</main>
<footer class="p-3 bg-slate-900/90 border-t border-slate-800">
<form id="chat-form" class="flex items-center gap-2" onsubmit="sendMessage(event)">
<input id="user-input" type="text" placeholder="Type your hand..." autocomplete="off" class="flex-1 bg-slate-800 text-slate-100 text-sm rounded-full px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700 transition placeholder-slate-400" />
<button type="submit" id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white p-3 rounded-full transition shadow-md flex items-center justify-center disabled:opacity-50">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 transform rotate-90">
<path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
</svg>
</button>
</form>
</footer>
</div>

<div id="history-view" class="hidden flex-1 overflow-y-auto">
<div id="stats-section" class="p-4 border-b border-slate-800 space-y-3"></div>
<div id="history-list" class="p-4 space-y-3">
<p class="text-sm text-slate-500 text-center py-8">No hands yet. Start coaching.</p>
</div>
</div>
</div>

<script>
const supabaseUrl = 'https://gqzyvfjcfgmocknrnxob.supabase.co';
const supabaseKey = 'sb_publishable_sdYei5FXQLjoe8PKL062Mw_oACuTYYj';
const sb = supabase.createClient(supabaseUrl, supabaseKey);
const authScreen = document.getElementById('auth-screen');
const appScreen = document.getElementById('app-screen');
const logoutBtn = document.getElementById('logout-btn');
let currentMode = 'coach';

function showApp() { authScreen.classList.add('hidden'); appScreen.classList.remove('hidden'); logoutBtn.classList.remove('hidden'); }
function showAuth() { authScreen.classList.remove('hidden'); appScreen.classList.add('hidden'); logoutBtn.classList.add('hidden'); }
function showError(m) { const e = document.getElementById('auth-error'); e.textContent = m; e.classList.remove('hidden'); setTimeout(() => e.classList.add('hidden'), 4000); }

document.getElementById('signup-btn').addEventListener('click', async () => {
const email = document.getElementById('email').value, password = document.getElementById('password').value;
if (!email ||!password) { showError('Enter email and password.'); return; }
const { data, error } = await sb.auth.signUp({ email, password });
if (error) { showError(error.message); return; }
if (data.session) showApp(); else showError('Account created. Check email to confirm.');
});
document.getElementById('signin-btn').addEventListener('click', async () => {
const email = document.getElementById('email').value, password = document.getElementById('password').value;
if (!email ||!password) { showError('Enter email and password.'); return; }
const { data, error } = await sb.auth.signInWithPassword({ email, password });
if (error) { showError(error.message); return; }
showApp();
});
logoutBtn.addEventListener('click', async () => { await sb.auth.signOut(); showAuth(); });
sb.auth.getSession().then(({ data: { session } }) => { if (session) showApp(); });

const modeCoachBtn = document.getElementById('mode-coach-btn');
const modeTrackBtn = document.getElementById('mode-track-btn');
const modeLabel = document.getElementById('mode-label');

modeCoachBtn.addEventListener('click', () => {
currentMode = 'coach';
modeCoachBtn.className = modeCoachBtn.className.replace('mode-inactive', 'mode-active');
modeTrackBtn.className = modeTrackBtn.className.replace('mode-active', 'mode-inactive');
modeLabel.innerHTML = '<p class="text-xs text-slate-500">Get real strategy on your hands.</p>';
resetChat();
});
modeTrackBtn.addEventListener('click', () => {
currentMode = 'track';
modeTrackBtn.className = modeTrackBtn.className.replace('mode-inactive', 'mode-active');
modeCoachBtn.className = modeCoachBtn.className.replace('mode-active', 'mode-inactive');
modeLabel.innerHTML = '<p class="text-xs text-slate-500">Log your hands, track your results. No advice - just data.</p>';
resetChat();
});

function resetChat() {
const chatbox = document.getElementById('chatbox');
const intro = currentMode === 'coach'? 'Send me any poker hand - your hole cards, the board, your position - and I\'ll give you a real read.': 'Log a hand - what you played, where, what happened. Like texting from the table. No advice, just data.';
chatbox.innerHTML = `<div class="flex items-start"><div class="bg-slate-800 text-slate-200 px-4 py-2.5 rounded-2xl rounded-tl-sm text-sm max-w-[85%] shadow-sm">${intro}</div></div>`;
document.getElementById('user-input').placeholder = currentMode === 'coach'? 'Type your hand...': 'Log your hand...';
}

const tabCoach = document.getElementById('tab-coach');
const tabHistory = document.getElementById('tab-history');
const coachView = document.getElementById('coach-view');
const historyView = document.getElementById('history-view');

tabCoach.addEventListener('click', () => {
tabCoach.className = tabCoach.className.replace('tab-inactive', 'tab-active');
tabHistory.className = tabHistory.className.replace('tab-active', 'tab-inactive');
coachView.classList.remove('hidden'); historyView.classList.add('hidden');
});
tabHistory.addEventListener('click', async () => {
tabHistory.className = tabHistory.className.replace('tab-inactive', 'tab-active');
tabCoach.className = tabCoach.className.replace('tab-active', 'tab-inactive');
coachView.classList.add('hidden'); historyView.classList.remove('hidden');
loadHistory();
});

function tierClass(t) {
if (!t) return 'tier-speculative';
const l = t.toLowerCase();
if (l === 'premium') return 'tier-premium';
if (l === 'strong') return 'tier-strong';
if (l === 'playable') return 'tier-playable';
if (l === 'speculative') return 'tier-speculative';
if (l === 'trash') return 'tier-trash';
return 'tier-speculative';
}

async function loadHistory() {
const { data: { session } } = await sb.auth.getSession();
if (!session) return;
try {
const res = await fetch('/api/history', { headers: { 'Authorization': 'Bearer ' + session.access_token } });
const data = await res.json();
const entries = data.history || [];
const statsEl = document.getElementById('stats-section');
const listEl = document.getElementById('history-list');
if (entries.length === 0) {
statsEl.innerHTML = ''; listEl.innerHTML = '<p class="text-sm text-slate-500 text-center py-8">No hands yet.</p>'; return;
}
const tiers = {}, positions = {}, hands = {}, actions = {};
let wins = 0, losses = 0, folds = 0, profit = 0;
entries.forEach(e => {
if (e.tier) { const k = e.tier.toLowerCase(); tiers[k] = (tiers[k] || 0) + 1; }
if (e.position) { positions[e.position] = (positions[e.position] || 0) + 1; }
if (e.hand) { hands[e.hand] = (hands[e.hand] || 0) + 1; }
if (e.player_action) { actions[e.player_action] = (actions[e.player_action] || 0) + 1; }
if (e.result === 'won') { wins++; if (e.amount) profit += e.amount; }
if (e.result === 'lost') { losses++; if (e.amount) profit -= e.amount; }
if (e.player_action && e.player_action.toLowerCase() === 'fold') folds++;
});
const topHand = Object.entries(hands).sort((a, b) => b[1] - a[1])[0];
const topTier = Object.entries(tiers).sort((a, b) => b[1] - a[1])[0];
const hasResults = wins + losses > 0;
const winRate = hasResults? Math.round((wins / (wins + losses)) * 100): null;
const profitStr = profit >= 0? '+$' + profit.toFixed(2): '-$' + Math.abs(profit).toFixed(2);
const foldPct = entries.length > 0? Math.round((folds / entries.length) * 100): 0;

let statsHTML = `<h3 class="text-sm font-semibold text-slate-300">Your Stats</h3><div class="grid grid-cols-3 gap-3">`;
statsHTML += `<div class="bg-slate-800 rounded-lg p-3 text-center"><p class="text-lg font-bold text-indigo-400">${entries.length}</p><p class="text-xs text-slate-500">Hands</p></div>`;
statsHTML += `<div class="bg-slate-800 rounded-lg p-3 text-center"><p class="text-lg font-bold text-emerald-400">${topHand? topHand[0]: '-'}</p><p class="text-xs text-slate-500">Most studied</p></div>`;
statsHTML += `<div class="bg-slate-800 rounded-lg p-3 text-center"><p class="text-lg font-bold text-amber-400 capitalize">${topTier? topTier[0]: '-'}</p><p class="text-xs text-slate-500">Top tier</p></div>`;
statsHTML += `</div><div class="grid grid-cols-2 gap-3 mt-3">`;
statsHTML += `<div class="bg-slate-800 rounded-lg p-3 text-center"><p class="text-lg font-bold text-slate-300">${foldPct}%</p><p class="text-xs text-slate-500">Fold rate</p></div>`;
if (hasResults) {
statsHTML += `<div class="bg-slate-800 rounded-lg p-3 text-center"><p class="text-lg font-bold ${profit >= 0? 'text-emerald-400': 'text-red-400'}">${profitStr}</p><p class="text-xs text-slate-500">${winRate}% win</p></div>`;
} else {
statsHTML += `<div class="bg-slate-800 rounded-lg p-3 text-center"><p class="text-lg font-bold text-slate-500">-</p><p class="text-xs text-slate-500">Log results</p></div>`;
}
statsHTML += `</div>`;
statsEl.innerHTML = statsHTML;

listEl.innerHTML = entries.map(e => {
let top = '<div class="flex items-center gap-2 flex-wrap">';
if (e.hand) top += `<span class="text-sm font-bold text-indigo-400">${e.hand}</span>`;
if (e.tier) top += `<span class="text-xs font-semibold px-2 py-0.5 rounded ${tierClass(e.tier)} text-white capitalize">${e.tier}</span>`;
if (e.position) top += `<span class="text-xs text-slate-500">${e.position}</span>`;
if (e.player_action) top += `<span class="text-xs font-semibold text-slate-300">${e.player_action}</span>`;
top += `<span class="text-xs text-slate-600 ml-auto">${new Date(e.created_at).toLocaleDateString()}</span></div>`;
let resultHTML = '';
if (e.result) {
resultHTML = `<div class="flex items-center gap-2 pt-1 border-t border-slate-700 mt-1">
<span class="text-xs font-semibold ${e.result === 'won'? 'text-emerald-400': 'text-red-400'}">${e.result === 'won'? 'Won': 'Lost'}</span>
${e.amount? `<span class="text-xs ${e.result === 'won'? 'text-emerald-400': 'text-red-400'}">$${e.amount.toFixed(2)}</span>`: ''}
</div>`;
} else if (e.player_action && e.player_action.toLowerCase() === 'fold') {
resultHTML = '';
} else if (!e.result) {
resultHTML = `<div class="pt-1 border-t border-slate-700 mt-1 space-y-2">
<p class="text-xs text-slate-500">Result?</p>
<div class="flex gap-2">
<input id="amt-${e.id}" type="number" step="0.01" placeholder="$" class="flex-1 bg-slate-700 text-slate-100 text-xs rounded px-3 py-1.5 outline-none border border-slate-600" />
<button onclick="logResult(${e.id}, 'won')" class="text-xs font-semibold px-3 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-white">Won</button>
<button onclick="logResult(${e.id}, 'lost')" class="text-xs font-semibold px-3 py-1.5 rounded bg-red-600 hover:bg-red-500 text-white">Lost</button>
</div>
</div>`;
}
return `<div class="bg-slate-800 rounded-xl p-4 space-y-2">${top}<p class="text-sm text-slate-300">${e.reply}</p>${resultHTML}</div>`;
}).join('');
} catch { document.getElementById('history-list').innerHTML = '<p class="text-sm text-red-400 text-center py-8">Could not load.</p>'; }
}

async function logResult(entryId, result) {
const { data: { session } } = await sb.auth.getSession();
if (!session) return;
const amtInput = document.getElementById('amt-' + entryId);
const amount = amtInput && amtInput.value? parseFloat(amtInput.value): null;
try {
await fetch('/api/result', {
method: 'POST',
headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
body: JSON.stringify({ id: entryId, result, amount })
});
loadHistory();
} catch {}
}

const chatbox = document.getElementById('chatbox');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

function appendMessage(text, isUser) {
const w = document.createElement('div'); w.className = isUser? 'flex justify-end': 'flex justify-start';
const b = document.createElement('div');
b.className = isUser? 'bg-indigo-600 text-white px-4 py-2.5 rounded-2xl rounded-tr-sm text-sm max-w-[85%] shadow-sm break-words whitespace-pre-wrap': 'bg-slate-800 text-slate-200 px-4 py-2.5 rounded-2xl rounded-tl-sm text-sm max-w-[85%] shadow-sm break-words whitespace-pre-wrap';
b.textContent = text; w.appendChild(b); chatbox.appendChild(w); chatbox.scrollTop = chatbox.scrollHeight; return b;
}

async function sendMessage(e) {
e.preventDefault(); const text = input.value.trim(); if (!text) return;
appendMessage(text, true); input.value = ''; input.disabled = true; sendBtn.disabled = true;
const lb = appendMessage('...', false);
const { data: { session } } = await sb.auth.getSession();
try {
const h = {'Content-Type': 'application/json'}; if (session) h['Authorization'] = 'Bearer ' + session.access_token;
const res = await fetch('/api/chat', { method: 'POST', headers: h, body: JSON.stringify({ message: text, mode: currentMode }) });
const data = await res.json();
lb.textContent = data.reply || data.error || 'No response.';
} catch { lb.textContent = 'Error: Could not reach the server.'; }
finally { input.disabled = false; sendBtn.disabled = false; input.focus(); chatbox.scrollTop = chatbox.scrollHeight; }
}
</script>
</body>
</html>
