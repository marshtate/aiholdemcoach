<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI Holdem Coach</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>.tab-active { color: #818cf8; border-bottom: 2px solid #818cf8; }.tab-inactive { color: #64748b; border-bottom: 2px solid transparent; }.tier-premium { background: #dc2626; }.tier-strong { background: #ea580c; }.tier-playable { background: #ca8a04; }.tier-speculative { background: #2563eb; }.tier-trash { background: #64748b; }
</style>
</head>
<body class="h-full flex flex-col max-w-xl mx-auto shadow-2xl bg-slate-900 text-slate-100 font-sans">
<header class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/80 backdrop-blur sticky top-0 z-10">
<div class="flex items-center space-x-3">
<div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
<h1 class="font-semibold text-base sm:text-lg">AI Holdem Coach</h1>
</div>
<button id="logout-btn" class="text-xs text-slate-400 hover:text-slate-200 hidden">Sign out</button>
</header>

<div id="auth-screen" class="flex-1 flex items-center justify-center p-6">
<div class="w-full max-w-sm space-y-6">
<div class="text-center space-y-2">
<h2 class="text-2xl font-bold text-slate-100">Welcome</h2>
<p class="text-sm text-slate-400">Sign in to start getting real reads.</p>
</div>
<div class="space-y-3">
<input id="email" type="email" placeholder="Email" class="w-full bg-slate-800 text-slate-100 text-sm rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700" />
<input id="password" type="password" placeholder="Password" class="w-full bg-slate-800 text-slate-100 text-sm rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700" />
</div>
<div class="space-y-2">
<button id="signin-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-3 rounded-lg transition">Sign In</button>
<button id="signup-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-white text-sm font-semibold py-3 rounded-lg transition">Create Account</button>
</div>
<p id="auth-error" class="text-xs text-red-400 text-center hidden"></p>
</div>
</div>

<div id="app-screen" class="hidden flex-1 flex flex-col">
<div class="flex border-b border-slate-800">
<button id="tab-coach" class="flex-1 py-3 text-sm font-semibold tab-active transition">Coach</button>
<button id="tab-history" class="flex-1 py-3 text-sm font-semibold tab-inactive transition">History</button>
</div>

<div id="coach-view" class="flex-1 flex flex-col">
<main id="chatbox" class="flex-1 overflow-y-auto p-4 space-y-4">
<div class="flex items-start">
<div class="bg-slate-800 text-slate-200 px-4 py-2.5 rounded-2xl rounded-tl-sm text-sm max-w-[85%] shadow-sm">
Send me any poker hand - your hole cards, the board, your position - and I'll give you a real read.
</div>
</div>
</main>
<footer class="p-3 bg-slate-900/90 border-t border-slate-800">
<form id="chat-form" class="flex items-center gap-2" onsubmit="sendMessage(event)">
<input id="user-input" type="text" placeholder="Type your hand..." autocomplete="off" class="flex-1 bg-slate-800 text-slate-100 text-sm rounded-full px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700 transition placeholder-slate-400" />
<button type="submit" id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white p-3 rounded-full transition shadow-md flex items-center justify-center disabled:opacity-50">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 transform rotate-90">
<path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
</svg>
</button>
</form>
</footer>
</div>

<div id="history-view" class="hidden flex-1 overflow-y-auto">
<div id="stats-section" class="p-4 border-b border-slate-800 space-y-3"></div>
<div id="history-list" class="p-4 space-y-3">
<p class="text-sm text-slate-500 text-center py-8">No hands yet. Start coaching.</p>
</div>
</div>
</div>

<script>
const supabaseUrl = 'https://gqzyvfjcfgmocknrnxob.supabase.co';
const supabaseKey = 'sb_publishable_sdYei5FXQLjoe8PKL062Mw_oACuTYYj';
const sb = supabase.createClient(supabaseUrl, supabaseKey);
const authScreen = document.getElementById('auth-screen');
const appScreen = document.getElementById('app-screen');
const logoutBtn = document.getElementById('logout-btn');
function showApp() { authScreen.classList.add('hidden'); appScreen.classList.remove('hidden'); logoutBtn.classList.remove('hidden'); }
function showAuth() { authScreen.classList.remove('hidden'); appScreen.classList.add('hidden'); logoutBtn.classList.add('hidden'); }
function showError(m) { const e = document.getElementById('auth-error'); e.textContent = m; e.classList.remove('hidden'); setTimeout(() => e.classList.add('hidden'), 4000); }

document.getElementById('signup-btn').addEventListener('click', async () => {
const email = document.getElementById('email').value, password = document.getElementById('password').value;
if (!email ||!password) { showError('Enter email and password.'); return; }
const { data, error } = await sb.auth.signUp({ email, password });
if (error) { showError(error.message); return; }
if (data.session) showApp(); else showError('Account created. Check email to confirm.');
});
document.getElementById('signin-btn').addEventListener('click', async () => {
const email = document.getElementById('email').value, password = document.getElementById('password').value;
if (!email ||!password) { showError('Enter email and password.'); return; }
const { data, error } = await sb.auth.signInWithPassword({ email, password });
if (error) { showError(error.message); return; }
showApp();
});
logoutBtn.addEventListener('click', async () => { await sb.auth.signOut(); showAuth(); });
sb.auth.getSession().then(({ data: { session } }) => { if (session) showApp(); });

const tabCoach = document.getElementById('tab-coach');
const tabHistory = document.getElementById('tab-history');
const coachView = document.getElementById('coach-view');
const historyView = document.getElementById('history-view');

tabCoach.addEventListener('click', () => {
tabCoach.className = tabCoach.className.replace('tab-inactive', 'tab-active');
tabHistory.className = tabHistory.className.replace('tab-active', 'tab-inactive');
coachView.classList.remove('hidden'); historyView.classList.add('hidden');
});
tabHistory.addEventListener('click', async () => {
tabHistory.className = tabHistory.className.replace('tab-inactive', 'tab-active');
tabCoach.className = tabCoach.className.replace('tab-active', 'tab-inactive');
coachView.classList.add('hidden'); historyView.classList.remove('hidden');
loadHistory();
});

function tierClass(t) {
if (!t) return 'tier-speculative';
const l = t.toLowerCase();
if (l === 'premium') return 'tier-premium';
if (l === 'strong') return 'tier-strong';
if (l === 'playable') return 'tier-playable';
if (l === 'speculative') return 'tier-speculative';
if (l === 'trash') return 'tier-trash';
return 'tier-speculative';
}

async function loadHistory() {
const { data: { session } } = await sb.auth.getSession();
if (!session) return;
try {
const res = await fetch('/api/history', { headers: { 'Authorization': 'Bearer ' + session.access_token } });
const data = await res.json();
const entries = data.history || [];
const statsEl = document.getElementById('stats-section');
const listEl = document.getElementById('history-list');
if (entries.length === 0) {
statsEl.innerHTML = '';
listEl.innerHTML = '<p class="text-sm text-slate-500 text-center py-8">No hands yet. Start coaching.</p>';
return;
}
const tiers = {}, positions = {}, hands = {};
entries.forEach(e => {
if (e.tier) { const k = e.tier.toLowerCase(); tiers[k] = (tiers[k] || 0) + 1; }
if (e.position) { positions[e.position] = (positions[e.position] || 0) + 1; }
if (e.hand) { hands[e.hand] = (hands[e.hand] || 0) + 1; }
});
const topHand = Object.entries(hands).sort((a, b) => b[1] - a[1])[0];
const topTier = Object.entries(tiers).sort((a, b) => b[1] - a[1])[0];
const posLabels = Object.entries(positions).sort((a, b) => b[1] - a[1]).slice(0, 3).map(p => p[0]).join(', ');

statsEl.innerHTML = `
<h3 class="text-sm font-semibold text-slate-300">Your Stats</h3>
<div class="grid grid-cols-3 gap-3">
<div class="bg-slate-800 rounded-lg p-3 text-center">
<p class="text-lg font-bold text-indigo-400">${entries.length}</p>
<p class="text-xs text-slate-500">Hands</p>
</div>
<div class="bg-slate-800 rounded-lg p-3 text-center">
<p class="text-lg font-bold text-emerald-400">${topHand? topHand[0]: '-'}</p>
<p class="text-xs text-slate-500">Most studied</p>
</div>
<div class="bg-slate-800 rounded-lg p-3 text-center">
<p class="text-lg font-bold text-amber-400 capitalize">${topTier? topTier[0]: '-'}</p>
<p class="text-xs text-slate-500">Top tier</p>
</div>
</div>
${posLabels? `<p class="text-xs text-slate-500 mt-1">Positions: ${posLabels}</p>`: ''}
`;

listEl.innerHTML = entries.map(e => `
<div class="bg-slate-800 rounded-xl p-4 space-y-2">
<div class="flex items-center gap-2">
${e.hand? `<span class="text-sm font-bold text-indigo-400">${e.hand}</span>`: ''}
${e.tier? `<span class="text-xs font-semibold px-2 py-0.5 rounded ${tierClass(e.tier)} text-white capitalize">${e.tier}</span>`: ''}
${e.position? `<span class="text-xs text-slate-500">${e.position}</span>`: ''}
<span class="text-xs text-slate-600 ml-auto">${new Date(e.created_at).toLocaleDateString()}</span>
</div>
<p class="text-sm text-slate-300">${e.reply}</p>
</div>
`).join('');
} catch { document.getElementById('history-list').innerHTML = '<p class="text-sm text-red-400 text-center py-8">Could not load history.</p>'; }
}

const chatbox = document.getElementById('chatbox');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

function appendMessage(text, isUser) {
const w = document.createElement('div'); w.className = isUser? 'flex justify-end': 'flex justify-start';
const b = document.createElement('div');
b.className = isUser? 'bg-indigo-600 text-white px-4 py-2.5 rounded-2xl rounded-tr-sm text-sm max-w-[85%] shadow-sm break-words whitespace-pre-wrap': 'bg-slate-800 text-slate-200 px-4 py-2.5 rounded-2xl rounded-tl-sm text-sm max-w-[85%] shadow-sm break-words whitespace-pre-wrap';
b.textContent = text; w.appendChild(b); chatbox.appendChild(w); chatbox.scrollTop = chatbox.scrollHeight; return b;
}

async function sendMessage(e) {
e.preventDefault(); const text = input.value.trim(); if (!text) return;
appendMessage(text, true); input.value = ''; input.disabled = true; sendBtn.disabled = true;
const lb = appendMessage('...', false);
const { data: { session } } = await sb.auth.getSession();
try {
const h = {'Content-Type': 'application/json'}; if (session) h['Authorization'] = 'Bearer ' + session.access_token;
const res = await fetch('/api/chat', { method: 'POST', headers: h, body: JSON.stringify({ message: text }) });
const data = await res.json(); lb.textContent = data.reply || data.error || 'No response.';
} catch { lb.textContent = 'Error: Could not reach the server.'; }
finally { input.disabled = false; sendBtn.disabled = false; input.focus(); chatbox.scrollTop = chatbox.scrollHeight; }
}
</script>
</body>
</html>
