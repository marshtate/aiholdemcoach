<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI Holdem Coach</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>.tab-active { color: #818cf8; border-bottom: 2px solid #818cf8; }.tab-inactive { color: #64748b; border-bottom: 2px solid transparent; }.tier-premium { background: #dc2626; }.tier-strong { background: #ea580c; }.tier-playable { background: #ca8a04; }.tier-speculative { background: #2563eb; }.tier-trash { background: #64748b; }.mode-active { background: #4f46e5; color: white; }.mode-inactive { background: #1e293b; color: #94a3b8; }.bar { height: 6px; border-radius: 3px; transition: width 0.4s ease; }.pulse-green { animation: pgreen 2s infinite; }
@keyframes pgreen { 0%,100%{opacity:1} 50%{opacity:0.5} }
</style>
</head>
<body class="h-full flex flex-col max-w-xl mx-auto shadow-2xl bg-slate-900 text-slate-100 font-sans">
<header class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/80 backdrop-blur sticky top-0 z-10">
<div class="flex items-center space-x-3">
<div id="session-dot" class="w-3 h-3 bg-slate-600 rounded-full"></div>
<h1 class="font-semibold text-base sm:text-lg">AI Holdem Coach</h1>
</div>
<button id="logout-btn" class="text-xs text-slate-400 hover:text-slate-200 hidden">Sign out</button>
</header>

<div id="auth-screen" class="flex-1 flex items-center justify-center p-6">
<div class="w-full max-w-sm space-y-6">
<div class="text-center space-y-2">
<h2 class="text-2xl font-bold text-slate-100">Welcome</h2>
<p class="text-sm text-slate-400">Sign in to start getting real reads.</p>
</div>
<div class="space-y-3">
<input id="email" type="email" placeholder="Email" class="w-full bg-slate-800 text-slate-100 text-sm rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700" />
<input id="password" type="password" placeholder="Password" class="w-full bg-slate-800 text-slate-100 text-sm rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700" />
</div>
<div class="space-y-2">
<button id="signin-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-3 rounded-lg transition">Sign In</button>
<button id="signup-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-white text-sm font-semibold py-3 rounded-lg transition">Create Account</button>
</div>
<p id="auth-error" class="text-xs text-red-400 text-center hidden"></p>
</div>
</div>

<div id="app-screen" class="hidden flex-1 flex flex-col">
<div class="flex border-b border-slate-800">
<button id="tab-chat" class="flex-1 py-3 text-sm font-semibold tab-active transition">Chat</button>
<button id="tab-history" class="flex-1 py-3 text-sm font-semibold tab-inactive transition">History</button>
<button id="tab-stats" class="flex-1 py-3 text-sm font-semibold tab-inactive transition">Stats</button>
</div>

<div id="chat-view" class="flex-1 flex flex-col">
<div id="mode-toggle" class="flex gap-2 p-3 border-b border-slate-800">
<button id="mode-coach-btn" class="flex-1 text-xs font-semibold py-2 rounded-lg mode-active transition">Coach</button>
<button id="mode-track-btn" class="flex-1 text-xs font-semibold py-2 rounded-lg mode-inactive transition">Track</button>
</div>
<div id="mode-label" class="px-4 pt-2 pb-1"><p class="text-xs text-slate-500">Get real strategy on your hands.</p></div>
<main id="chatbox" class="flex-1 overflow-y-auto p-4 space-y-4">
<div class="flex items-start">
<div class="bg-slate-800 text-slate-200 px-4 py-2.5 rounded-2xl rounded-tl-sm text-sm max-w-[85%] shadow-sm">
Send me any hand - your cards, the board, your position - and I'll give you a real read.
</div>
</div>
</main>
<footer class="p-3 bg-slate-900/90 border-t border-slate-800">
<form id="chat-form" class="flex items-center gap-2" onsubmit="sendMessage(event)">
<input id="user-input" type="text" placeholder="Type your hand..." autocomplete="off" class="flex-1 bg-slate-800 text-slate-100 text-sm rounded-full px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700 transition placeholder-slate-400" />
<button type="submit" id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white p-3 rounded-full transition shadow-md flex items-center justify-center disabled:opacity-50">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 transform rotate-90">
<path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
</svg>
</button>
</form>
</footer>
</div>

<div id="history-view" class="hidden flex-1 overflow-y-auto p-4 space-y-3">
<p class="text-sm text-slate-500 text-center py-8">No hands yet.</p>
</div>

<div id="stats-view" class="hidden flex-1 overflow-y-auto p-4 space-y-4">
<p class="text-sm text-slate-500 text-center py-8">No data yet.</p>
</div>
</div>

<script>
const supabaseUrl = 'https://gqzyvfjcfgmocknrnxob.supabase.co';
const supabaseKey = 'sb_publishable_sdYei5FXQLjoe8PKL062Mw_oACuTYYj';
const sb = supabase.createClient(supabaseUrl, supabaseKey);
const authScreen = document.getElementById('auth-screen');
const appScreen = document.getElementById('app-screen');
const logoutBtn = document.getElementById('logout-btn');
const sessionDot = document.getElementById('session-dot');
let currentMode = 'coach';
let cachedHistory = null;

function showApp() { authScreen.classList.add('hidden'); appScreen.classList.remove('hidden'); logoutBtn.classList.remove('hidden'); checkSession(); }
function showAuth() { authScreen.classList.remove('hidden'); appScreen.classList.add('hidden'); logoutBtn.classList.add('hidden'); }
function showError(m) { const e = document.getElementById('auth-error'); e.textContent = m; e.classList.remove('hidden'); setTimeout(() => e.classList.add('hidden'), 4000); }

async function checkSession() {
const { data: { session } } = await sb.auth.getSession();
if (!session) return;
try {
const res = await fetch('/api/sessions', { headers: { 'Authorization': 'Bearer ' + session.access_token } });
const data = await res.json();
const open = (data.sessions || []).find(s => s.status === 'open');
if (open) { sessionDot.className = 'w-3 h-3 bg-emerald-500 rounded-full pulse-green'; }
else { sessionDot.className = 'w-3 h-3 bg-slate-600 rounded-full'; }
} catch {}
}

document.getElementById('signup-btn').addEventListener('click', async () => {
const email = document.getElementById('email').value, password = document.getElementById('password').value;
if (!email ||!password) { showError('Enter email and password.'); return; }
const { data, error } = await sb.auth.signUp({ email, password });
if (error) { showError(error.message); return; }
if (data.session) showApp(); else showError('Account created. Check email to confirm.');
});
document.getElementById('signin-btn').addEventListener('click', async () => {
const email = document.getElementById('email').value, password = document.getElementById('password').value;
if (!email ||!password) { showError('Enter email and password.'); return; }
const { data, error } = await sb.auth.signInWithPassword({ email, password });
if (error) { showError(error.message); return; }
showApp();
});
logoutBtn.addEventListener('click', async () => { await sb.auth.signOut(); showAuth(); });
sb.auth.getSession().then(({ data: { session } }) => { if (session) showApp(); });

const modeCoachBtn = document.getElementById('mode-coach-btn');
const modeTrackBtn = document.getElementById('mode-track-btn');
const modeLabel = document.getElementById('mode-label');

modeCoachBtn.addEventListener('click', () => {
currentMode = 'coach';
modeCoachBtn.className = modeCoachBtn.className.replace('mode-inactive', 'mode-active');
modeTrackBtn.className = modeTrackBtn.className.replace('mode-active', 'mode-inactive');
modeLabel.innerHTML = '<p class="text-xs text-slate-500">Get real strategy on your hands.</p>';
resetChat();
});
modeTrackBtn.addEventListener('click', () => {
currentMode = 'track';
modeTrackBtn.className = modeTrackBtn.className.replace('mode-inactive', 'mode-active');
modeCoachBtn.className = modeCoachBtn.className.replace('mode-active', 'mode-inactive');
modeLabel.innerHTML = '<p class="text-xs text-slate-500">Log hands - like texting from the table. When you\'re done, tell me your profit or loss.</p>';
resetChat();
});

function resetChat() {
const chatbox = document.getElementById('chatbox');
const intro = currentMode === 'coach'? 'Send me any hand - your cards, the board, your position - and I\'ll give you a real read.': 'Log a hand - what you played, where, what happened. When you\'re done for the night, tell me how you did - up $40, down $12 - and I\'ll close it out.';
chatbox.innerHTML = `<div class="flex items-start"><div class="bg-slate-800 text-slate-200 px-4 py-2.5 rounded-2xl rounded-tl-sm text-sm max-w-[85%] shadow-sm">${intro}</div></div>`;
document.getElementById('user-input').placeholder = currentMode === 'coach'? 'Type your hand...': 'Log your hand...';
}

const tabChat = document.getElementById('tab-chat');
const tabHistory = document.getElementById('tab-history');
const tabStats = document.getElementById('tab-stats');
const chatView = document.getElementById('chat-view');
const historyView = document.getElementById('history-view');
const statsView = document.getElementById('stats-view');

function setActiveTab(active) {
[tabChat, tabHistory, tabStats].forEach(t => t.className = t.className.replace('tab-active', 'tab-inactive'));
chatView.classList.add('hidden'); historyView.classList.add('hidden'); statsView.classList.add('hidden');
active.className = active.className.replace('tab-inactive', 'tab-active');
}
tabChat.addEventListener('click', () => { setActiveTab(tabChat); chatView.classList.remove('hidden'); });
tabHistory.addEventListener('click', () => { setActiveTab(tabHistory); historyView.classList.remove('hidden'); loadHistory(); });
tabStats.addEventListener('click', () => { setActiveTab(tabStats); statsView.classList.remove('hidden'); loadStats(); });

function tierClass(t) {
if (!t) return 'tier-speculative';
const l = t.toLowerCase();
if (l === 'premium') return 'tier-premium';
if (l === 'strong') return 'tier-strong';
if (l === 'playable') return 'tier-playable';
if (l === 'speculative') return 'tier-speculative';
if (l === 'trash') return 'tier-trash';
return 'tier-speculative';
}

async function fetchHistory() {
if (cachedHistory) return cachedHistory;
const { data: { session } } = await sb.auth.getSession();
if (!session) return [];
try {
const res = await fetch('/api/history', { headers: { 'Authorization': 'Bearer ' + session.access_token } });
const data = await res.json();
cachedHistory = data.history || [];
return cachedHistory;
} catch { return []; }
}

async function fetchSessions() {
const { data: { session } } = await sb.auth.getSession();
if (!session) return [];
try {
const res = await fetch('/api/sessions', { headers: { 'Authorization': 'Bearer ' + session.access_token } });
const data = await res.json();
return data.sessions || [];
} catch { return []; }
}

async function loadHistory() {
const entries = await fetchHistory();
const el = document.getElementById('history-view');
if (entries.length === 0) { el.innerHTML = '<p class="text-sm text-slate-500 text-center py-8">No hands yet.</p>'; return; }
el.innerHTML = entries.map(e => {
let top = '<div class="flex items-center gap-2 flex-wrap">';
if (e.hand) top += `<span class="text-sm font-bold text-indigo-400">${e.hand}</span>`;
if (e.tier) top += `<span class="text-xs font-semibold px-2 py-0.5 rounded ${tierClass(e.tier)} text-white capitalize">${e.tier}</span>`;
if (e.position) top += `<span class="text-xs text-slate-500">${e.position}</span>`;
if (e.player_action) top += `<span class="text-xs font-semibold text-slate-300">${e.player_action}</span>`;
top += `<span class="text-xs text-slate-600 ml-auto">${new Date(e.created_at).toLocaleDateString()}</span></div>`;
let resultHTML = '';
if (e.result) {
resultHTML = `<div class="flex items-center gap-2 pt-1 border-t border-slate-700 mt-1">
<span class="text-xs font-semibold ${e.result === 'won'? 'text-emerald-400': 'text-red-400'}">${e.result === 'won'? 'Won': 'Lost'}</span>
${e.amount? `<span class="text-xs ${e.result === 'won'? 'text-emerald-400': 'text-red-400'}">$${e.amount.toFixed(2)}</span>`: ''}
</div>`;
}
return `<div class="bg-slate-800 rounded-xl p-4 space-y-2">${top}<p class="text-sm text-slate-300">${e.reply}</p>${resultHTML}</div>`;
}).join('');
}

async function loadStats() {
const entries = await fetchHistory();
const sessions = await fetchSessions();
const el = document.getElementById('stats-view');
if (entries.length === 0 && sessions.length === 0) { el.innerHTML = '<p class="text-sm text-slate-500 text-center py-8">No data yet.</p>'; return; }

const tiers = {}, hands = {}, actions = {};
let folds = 0;
entries.forEach(e => {
if (e.tier) { const k = e.tier.toLowerCase(); tiers[k] = (tiers[k] || 0) + 1; }
if (e.hand) { hands[e.hand] = (hands[e.hand] || 0) + 1; }
if (e.player_action) { const a = e.player_action.toLowerCase(); actions[a] = (actions[a] || 0) + 1; if (a === 'fold') folds++; }
});

const foldPct = entries.length > 0? Math.round((folds / entries.length) * 100): 0;
const closed = sessions.filter(s => s.status === 'closed' && s.profit!== null);
const open = sessions.find(s => s.status === 'open');
const totalProfit = closed.reduce((sum, s) => sum + (s.profit || 0), 0);
const wins = closed.filter(s => s.profit > 0).length;
const winRate = closed.length > 0? Math.round((wins / closed.length) * 100): null;
const profitStr = totalProfit >= 0? '+$' + totalProfit.toFixed(2): '-$' + Math.abs(totalProfit).toFixed(2);
const avgProfit = closed.length > 0? (totalProfit / closed.length): 0;
const avgStr = avgProfit >= 0? '+$' + avgProfit.toFixed(2): '-$' + Math.abs(avgProfit).toFixed(2);

let html = '';

if (open) {
html += `<div class="bg-emerald-900/30 border border-emerald-800 rounded-xl p-4 space-y-1">
<div class="flex items-center gap-2"><div class="w-2 h-2 bg-emerald-500 rounded-full pulse-green"></div><span class="text-xs font-semibold text-emerald-400">Session open</span></div>
<p class="text-xs text-slate-400">Log hands. When you're done, tell me your profit or loss.</p>
</div>`;
}

html += `<div class="bg-slate-800 rounded-xl p-4 space-y-2">
<h3 class="text-sm font-semibold text-slate-300">Overview</h3>
<div class="grid grid-cols-2 gap-3">
<div class="bg-slate-900 rounded-lg p-3 text-center">
<p class="text-xl font-bold text-indigo-400">${entries.length}</p>
<p class="text-xs text-slate-500">Hands</p>
</div>
<div class="bg-slate-900 rounded-lg p-3 text-center">
<p class="text-xl font-bold text-slate-300">${foldPct}%</p>
<p class="text-xs text-slate-500">Fold rate</p>
</div>
</div>
</div>`;

if (closed.length > 0) {
html += `<div class="bg-slate-800 rounded-xl p-4 space-y-2">
<h3 class="text-sm font-semibold text-slate-300">Sessions</h3>
<div class="grid grid-cols-2 gap-3">
<div class="bg-slate-900 rounded-lg p-3 text-center">
<p class="text-xl font-bold text-indigo-400">${closed.length}</p>
<p class="text-xs text-slate-500">Played</p>
</div>
<div class="bg-slate-900 rounded-lg p-3 text-center">
<p class="text-xl font-bold ${totalProfit >= 0? 'text-emerald-400': 'text-red-400'}">${profitStr}</p>
<p class="text-xs text-slate-500">Total profit</p>
</div>
<div class="bg-slate-900 rounded-lg p-3 text-center">
<p class="text-xl font-bold text-amber-400">${winRate}%</p>
<p class="text-xs text-slate-500">Win rate</p>
</div>
<div class="bg-slate-900 rounded-lg p-3 text-center">
<p class="text-xl font-bold ${avgProfit >= 0? 'text-emerald-400': 'text-red-400'}">${avgStr}</p>
<p class="text-xs text-slate-500">Avg per night</p>
</div>
</div>
</div>`;

const recent = closed.slice(0, 5).reverse();
html += `<div class="bg-slate-800 rounded-xl p-4 space-y-3">
<h3 class="text-sm font-semibold text-slate-300">Recent nights</h3>
${recent.map(s => {
const d = new Date(s.closed_at || s.created_at).toLocaleDateString();
const p = s.profit || 0;
return `<div class="flex justify-between items-center text-xs">
<span class="text-slate-400">${d}</span>
<span class="font-semibold ${p >= 0? 'text-emerald-400': 'text-red-400'}">${p >= 0? '+': ''}$${p.toFixed(2)}</span>
</div>`;
}).join('')}
</div>`;
} else {
html += `<div class="bg-slate-800 rounded-xl p-4">
<p class="text-sm text-slate-500 text-center">Track a session and close it to see your nights.</p>
</div>`;
}

const topHands = Object.entries(hands).sort((a, b) => b[1] - a[1]).slice(0, 5);
if (topHands.length > 0) {
const maxH = topHands[0][1];
html += `<div class="bg-slate-800 rounded-xl p-4 space-y-3">
<h3 class="text-sm font-semibold text-slate-300">Most studied</h3>
${topHands.map(([h, c]) => `
<div class="space-y-1">
<div class="flex justify-between text-xs"><span class="text-indigo-400 font-bold">${h}</span><span class="text-slate-500">${c}</span></div>
<div class="w-full bg-slate-900 rounded-full"><div class="bar bg-indigo-500" style="width: ${Math.round((c / maxH) * 100)}%"></div></div>
</div>`).join('')}
</div>`;
}

const actionOrder = ['fold', 'call', 'raise', '3-bet', 'check', 'all-in'];
const actionColors = { fold: 'bg-slate-500', call: 'bg-blue-500', raise: 'bg-emerald-500', '3-bet': 'bg-purple-500', check: 'bg-slate-400', 'all-in': 'bg-red-500' };
const actionEntries = actionOrder.filter(a => actions[a]);
if (actionEntries.length > 0) {
const maxA = Math.max(...actionEntries.map(a => actions[a]));
html += `<div class="bg-slate-800 rounded-xl p-4 space-y-3">
<h3 class="text-sm font-semibold text-slate-300">Actions</h3>
${actionEntries.map(a => `
<div class="space-y-1">
<div class="flex justify-between text-xs"><span class="capitalize text-slate-300">${a}</span><span class="text-slate-500">${actions[a]}</span></div>
<div class="w-full bg-slate-900 rounded-full"><div class="bar ${actionColors[a] || 'bg-slate-500'}" style="width: ${Math.round((actions[a] / maxA) * 100)}%"></div></div>
</div>`).join('')}
</div>`;
}

el.innerHTML = html;
}

async function logResult(entryId, result) {
const { data: { session } } = await sb.auth.getSession();
if (!session) return;
const amtInput = document.getElementById('amt-' + entryId);
const amount = amtInput && amtInput.value? parseFloat(amtInput.value): null;
try {
await fetch('/api/result', {
method: 'POST',
headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
body: JSON.stringify({ id: entryId, result, amount })
});
cachedHistory = null;
loadHistory();
} catch {}
}

const chatbox = document.getElementById('chatbox');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

function appendMessage(text, isUser) {
const w = document.createElement('div'); w.className = isUser? 'flex justify-end': 'flex justify-start';
const b = document.createElement('div');
b.className = isUser? 'bg-indigo-600 text-white px-4 py-2.5 rounded-2xl rounded-tr-sm text-sm max-w-[85%] shadow-sm break-words whitespace-pre-wrap': 'bg-slate-800 text-slate-200 px-4 py-2.5 rounded-2xl rounded-tl-sm text-sm max-w-[85%] shadow-sm break-words whitespace-pre-wrap';
b.textContent = text; w.appendChild(b); chatbox.appendChild(w); chatbox.scrollTop = chatbox.scrollHeight; return b;
}

async function sendMessage(e) {
e.preventDefault(); const text = input.value.trim(); if (!text) return;
appendMessage(text, true); input.value = ''; input.disabled = true; sendBtn.disabled = true;
const lb = appendMessage('...', false);
const { data: { session } } = await sb.auth.getSession();
try {
const h = {'Content-Type': 'application/json'}; if (session) h['Authorization'] = 'Bearer ' + session.access_token;
const res = await fetch('/api/chat', { method: 'POST', headers: h, body: JSON.stringify({ message: text, mode: currentMode }) });
const data = await res.json();
lb.textContent = data.reply || data.error || 'No response.';
if (data.reply && data.reply.includes('Session closed')) {
checkSession();
cachedHistory = null;
} else {
cachedHistory = null;
}
} catch { lb.textContent = 'Error: Could not reach the server.'; }
finally { input.disabled = false; sendBtn.disabled = false; input.focus(); chatbox.scrollTop = chatbox.scrollHeight; }
}
</script>
</body>
</html>
